version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    network_mode: "host"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./config:/app/config
      - /etc/haproxy:/etc/haproxy
      - /var/run/haproxy.sock:/var/run/haproxy.sock:ro
      - /var/lib/haproxy:/var/lib/haproxy:ro
      - /bin/systemctl:/bin/systemctl:ro
    cap_add:
      - SYS_ADMIN
    # These settings help the container interact with host services
    environment:
      - HOST_HOSTNAME=localhost

volumes:
  config-data:
